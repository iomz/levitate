# Small single-backend deployment using one static bearer token.
# Set LEVITATE_TOKEN before starting Levitate.

[server]
name = "example-bearer"
host = "127.0.0.1"
port = 8787
mcp_path = "/mcp"

[stdio]
command = "node"
args = ["test/fixtures/fake-stdio-server.mjs"]

[auth]
mode = "bearer"
token_env = "LEVITATE_TOKEN"

[tools]
allow = ["fake_allowed"]
deny = ["fake_denied"]
